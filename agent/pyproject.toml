[project]
name = "tutorial-slack-agent"
version = "0.1.0"
description = "Minimal Slack AI agent that connects to Keycard-protected MCP servers with per-user OAuth"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Keycard", email = "support@keycard.ai" }]
dependencies = [
    "keycardai-mcp>=0.26,<1.0",
    "keycardai-oauth>=0.20",
    "slack-bolt>=1.21,<2.0",
    "anthropic>=0.40,<1.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "aiohttp>=3.11",
]

[project.scripts]
slack-agent = "slack_agent.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slack_agent"]
