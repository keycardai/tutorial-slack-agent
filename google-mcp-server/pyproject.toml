[project]
name = "google-mcp-server"
version = "0.1.0"
description = "Google MCP server (Calendar, Drive, Docs, Gmail, Sheets) protected by Keycard"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.2",
    "python-dotenv>=1.0.0",
    "keycardai-fastmcp>=0.4.0",
    "keycardai-mcp>=0.26.0",
    "keycardai-oauth>=0.20.0",
    "uvicorn[standard]>=0.29.0",
    "starlette>=0.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/google_mcp_server"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
